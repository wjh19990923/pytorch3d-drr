[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch3d-drr"
version = "0.1.0.dev0"
description = "Research DRR and surface silhouette rendering with PyTorch3D"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "nibabel", "numpy-stl"]

[project.optional-dependencies]
examples = ["h5py", "matplotlib"]

[project.scripts]
pytorch3d-drr = "pytorch3d_drr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
